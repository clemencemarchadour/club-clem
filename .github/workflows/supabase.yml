name: Supabase config
on:
  workflow_dispatch:
    inputs:
      task:
        description: "templates | sql"
        required: true
        default: templates
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          TASK: ${{ github.event.inputs.task }}
        run: python3 .github/scripts/supabase_task.py
